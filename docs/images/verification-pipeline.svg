<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Mouse Battery Tray verification pipeline</title>
  <desc id="desc">Quality pipeline from source checks through real hardware verification and packaged application smoke tests.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10213d"/></linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .t{font:700 44px "Segoe UI",Arial,sans-serif;fill:#f8fafc}.s{font:400 22px "Segoe UI",Arial,sans-serif;fill:#94a3b8}
      .h{font:700 22px "Segoe UI",Arial,sans-serif;fill:#f8fafc}.b{font:400 18px "Segoe UI",Arial,sans-serif;fill:#cbd5e1}
      .p{font:700 16px "Segoe UI",Arial,sans-serif;fill:#bbf7d0}.m{font:600 16px Consolas,monospace;fill:#bfdbfe}
    </style>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg2)"/>
  <text x="70" y="78" class="t">Verification pipeline</text>
  <text x="70" y="118" class="s">「動くはず」ではなく、単体・実機・パッケージ・GUIの各層で確認</text>

  <g transform="translate(70 190)">
    <rect width="190" height="190" rx="24" fill="#111c2e" stroke="#334155" stroke-width="2"/>
    <text x="25" y="48" class="h">1. Static checks</text>
    <text x="25" y="88" class="b">Ruff</text><text x="25" y="118" class="b">Mypy</text>
    <rect x="25" y="142" width="76" height="28" rx="14" fill="#14532d"/><text x="43" y="162" class="p">PASS</text>
  </g>
  <path d="M270 285 L330 285" stroke="#64748b" stroke-width="4" marker-end="url(#a2)"/>

  <g transform="translate(340 190)">
    <rect width="190" height="190" rx="24" fill="#111c2e" stroke="#334155" stroke-width="2"/>
    <text x="25" y="48" class="h">2. Unit tests</text>
    <text x="25" y="88" class="b">protocol parse</text><text x="25" y="118" class="b">config / concurrency</text>
    <text x="25" y="156" class="m">pytest suite</text>
  </g>
  <path d="M540 285 L600 285" stroke="#64748b" stroke-width="4" marker-end="url(#a2)"/>

  <g transform="translate(610 190)">
    <rect width="220" height="190" rx="24" fill="#10271f" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="48" class="h">3. Real hardware</text>
    <text x="25" y="88" class="b">ATTACK SHARK X1</text><text x="25" y="118" class="b">receiver packet read</text>
    <text x="25" y="156" class="m">0x5A → 90%</text>
  </g>
  <path d="M840 285 L900 285" stroke="#64748b" stroke-width="4" marker-end="url(#a2)"/>

  <g transform="translate(910 190)">
    <rect width="205" height="190" rx="24" fill="#111c2e" stroke="#334155" stroke-width="2"/>
    <text x="25" y="48" class="h">4. Package</text>
    <text x="25" y="88" class="b">PyInstaller EXE</text><text x="25" y="118" class="b">smoke test</text>
    <rect x="25" y="142" width="76" height="28" rx="14" fill="#14532d"/><text x="43" y="162" class="p">PASS</text>
  </g>
  <path d="M1125 285 L1185 285" stroke="#64748b" stroke-width="4" marker-end="url(#a2)"/>

  <g transform="translate(1195 190)">
    <rect width="335" height="190" rx="24" fill="#0f2445" stroke="#3b82f6" stroke-width="2"/>
    <text x="25" y="48" class="h">5. Windows GUI smoke</text>
    <text x="25" y="88" class="b">tray menu / settings / logs</text>
    <text x="25" y="118" class="b">duplicate launch / clean quit</text>
    <rect x="25" y="142" width="130" height="28" rx="14" fill="#1e3a8a"/><text x="43" y="162" class="p">PR workflow</text>
  </g>

  <rect x="70" y="455" width="1460" height="155" rx="24" fill="#0c1829" stroke="#334155" stroke-width="2"/>
  <text x="105" y="505" class="h">Two complementary guarantees</text>
  <text x="105" y="548" class="b">CI: fresh Windows runnerで再現性を確認　＋　Local hardware E2E: 実レシーバーでしか検証できないHID通信を確認</text>
  <text x="105" y="585" class="s">クラウドCIだけで「実機対応済み」と扱わず、検証できる境界を明示する</text>
</svg>