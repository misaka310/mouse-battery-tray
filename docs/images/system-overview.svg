<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mouse Battery Tray architecture</title>
  <desc id="desc">The ATTACK SHARK X1 HID protocol is normalized into one battery state and rendered in the Windows notification area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111c33"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 48px "Segoe UI",Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 24px "Segoe UI",Arial,sans-serif;fill:#94a3b8}
      .label{font:700 25px "Segoe UI",Arial,sans-serif;fill:#f8fafc}.body{font:400 20px "Segoe UI",Arial,sans-serif;fill:#cbd5e1}
      .small{font:600 18px "Segoe UI",Arial,sans-serif;fill:#94a3b8}.mono{font:600 18px Consolas,monospace;fill:#dbeafe}
      .chip{font:700 17px "Segoe UI",Arial,sans-serif;fill:#dbeafe}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" class="title">Mouse Battery Tray — Architecture</text>
  <text x="80" y="124" class="subtitle">ATTACK SHARK X1のHID状態を共通モデルへ正規化し、Windows通知領域へ常駐表示</text>

  <rect x="70" y="185" width="360" height="225" rx="24" fill="#101b31" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="230" class="label">ATTACK SHARK X1</text>
  <text x="100" y="268" class="body">2.4 GHz USB receiver</text>
  <rect x="100" y="296" width="300" height="78" rx="16" fill="#132643" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="326" class="small">Beken passive packet</text>
  <text x="120" y="357" class="mono">03 B1 40 01 5A → 90%</text>

  <path d="M430 300 C510 300 510 355 585 355" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="585" y="255" width="360" height="275" rx="28" fill="#0f2445" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="615" y="285" width="170" height="34" rx="17" fill="#1d4ed8"/>
  <text x="632" y="309" class="chip">Protocol adapter</text>
  <text x="615" y="360" class="label">BatteryState へ正規化</text>
  <text x="615" y="402" class="body">device / battery / status</text>
  <text x="615" y="436" class="body">charging / full / error</text>
  <line x1="615" y1="466" x2="915" y2="466" stroke="#334155" stroke-width="2"/>
  <text x="615" y="500" class="small">モデル固有処理をUIから分離</text>

  <path d="M945 392 L1045 392" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1045" y="210" width="470" height="365" rx="28" fill="#10271f" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1075" y="240" width="150" height="34" rx="17" fill="#047857"/>
  <text x="1093" y="264" class="chip">Application core</text>
  <text x="1075" y="316" class="label">安全にポーリングしてUIへ反映</text>

  <rect x="1075" y="346" width="195" height="82" rx="16" fill="#123829"/>
  <text x="1095" y="378" class="small">HID access</text><text x="1095" y="407" class="body">排他ロック</text>
  <rect x="1290" y="346" width="195" height="82" rx="16" fill="#123829"/>
  <text x="1310" y="378" class="small">Status mapping</text><text x="1310" y="407" class="body">-- / ! / 99+</text>
  <rect x="1075" y="450" width="195" height="82" rx="16" fill="#123829"/>
  <text x="1095" y="482" class="small">Low battery</text><text x="1095" y="511" class="body">1回だけ通知</text>
  <rect x="1290" y="450" width="195" height="82" rx="16" fill="#123829"/>
  <text x="1310" y="482" class="small">Single instance</text><text x="1310" y="511" class="body">mutexで二重起動防止</text>

  <path d="M1280 575 L1280 650" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="865" y="665" width="650" height="145" rx="26" fill="#171e2d" stroke="#475569" stroke-width="2"/>
  <text x="895" y="710" class="label">Windows user experience</text>
  <text x="895" y="750" class="body">通知領域の数値アイコン · 設定画面 · 低残量通知 · Windows自動起動</text>
  <text x="895" y="786" class="small">管理者権限不要 / ローカル完結 / メーカー常駐アプリ不要</text>

  <rect x="70" y="735" width="680" height="95" rx="22" fill="#0d1b2a" stroke="#334155" stroke-width="2"/>
  <text x="100" y="774" class="small">設計の狙い</text>
  <text x="100" y="807" class="body">「デバイス固有HID」 と 「利用者向けUI」 をadapter境界で分離し、機種追加を局所化</text>
</svg>