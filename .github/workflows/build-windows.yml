name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Install quality dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Lint correctness
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check src tests

      - name: Lint HID boundary maintainability
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check --select I,UP,B src\sprime_pm1_battery_tray\hid_protocol.py tests\test_hid_protocol.py tests\test_hid_protocol_quality.py

      - name: Typecheck HID protocol
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m mypy src\sprime_pm1_battery_tray\hid_protocol.py

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\.venv\Scripts\python.exe -m coverage erase
          .\.venv\Scripts\python.exe -m coverage run -m pytest tests

      - name: Enforce repository coverage floor
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m coverage report

      - name: Enforce HID protocol coverage
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\.venv\Scripts\python.exe -m coverage erase
          .\.venv\Scripts\python.exe -m coverage run --branch --source=sprime_pm1_battery_tray.hid_protocol -m pytest tests\test_hid_protocol.py tests\test_hid_protocol_quality.py
          .\.venv\Scripts\python.exe -m coverage report --fail-under=90

      - name: Build EXE
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Package EXE folder
        shell: pwsh
        run: |
          $packageName = "Mouse-Battery-Tray-${{ github.ref_name }}.zip"
          if ("${{ github.ref_type }}" -ne "tag") {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $packageName = "Mouse-Battery-Tray-$shortSha.zip"
          }
          Compress-Archive -Path "dist\Mouse-Battery-Tray\*" -DestinationPath $packageName -Force
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mouse-Battery-Tray
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_NAME }}
          generate_release_notes: true
