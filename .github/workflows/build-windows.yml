name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Verify and build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install application dependencies
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Install quality dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Lint
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check src tests

      - name: Typecheck protocol boundary
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe -m mypy
          src\mouse_battery_tray\attack_shark.py
          src\mouse_battery_tray\battery_reader.py

      - name: Run unit tests with coverage
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\.venv\Scripts\python.exe -m coverage erase
          .\.venv\Scripts\python.exe -m coverage run -m pytest tests
          .\.venv\Scripts\python.exe -m coverage report

      - name: Enforce ATTACK SHARK adapter coverage
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          .\.venv\Scripts\python.exe -m coverage erase
          .\.venv\Scripts\python.exe -m coverage run --branch --source=mouse_battery_tray.attack_shark -m pytest tests\test_attack_shark.py
          .\.venv\Scripts\python.exe -m coverage report --fail-under=85

      - name: Build EXE
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: .\dist\Mouse-Battery-Tray\Mouse-Battery-Tray.exe --smoke-test

      - name: Package EXE folder
        shell: pwsh
        run: |
          $packageName = "Mouse-Battery-Tray-${{ github.ref_name }}.zip"
          if ("${{ github.ref_type }}" -ne "tag") {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $packageName = "Mouse-Battery-Tray-$shortSha.zip"
          }
          Compress-Archive -Path "dist\Mouse-Battery-Tray\*" -DestinationPath $packageName -Force
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mouse-battery-tray-package
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mouse-battery-tray-package
          path: .release

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: .release/*.zip
          generate_release_notes: true
